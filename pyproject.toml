[project]
name = "xana"
version = "0.1.0"
description = "Input/output-first agent runtime skeleton."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "httpx>=0.28",
    "pyyaml>=6",
    "prompt_toolkit>=3.0",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "croniter>=2.0",
    "ddgs>=9.0",
    "textual>=0.85",
    "telegramify-markdown>=1.2.0",
]

[project.optional-dependencies]
qr = ["qrcode>=7.4"]
feishu-ws = ["lark-oapi>=1.4"]

[project.scripts]
xana = "xana.cli.xana:main"
xanac = "xana.cli.xanac:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xana.config" = ["defaults/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "merge_gate: design-contract regression tests; run only on big merges (pytest -m merge_gate)",
]
